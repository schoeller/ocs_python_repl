[package]
name = "ocs_python_repl"
version = "0.1.11"
edition = "2021"
description = "Python REPL plugin for Open CAD Studio (API v4)."
license = "GPL-3.0-only"

[workspace]

[lib]
name = "ocs_python_repl"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable the diagnostic global allocator that logs allocations larger than 1 GiB.
# This is useful for debugging OOM aborts but adds overhead to every allocation.
alloc-debug = []

# The upstream Open CAD Studio tag this plugin is pinned to.
# The repin workflow reads this file, fetches the upstream Cargo.lock at that
# tag, and rewrites the dependency pins below. Do not edit the dependency lines
# by hand; run `scripts/repin.py` (or the `repin` GitHub Actions workflow).
[package.metadata.upstream]
tag = "v0.9.7"

[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", tag = "v0.9.7", features = ["host"] }
acadrust = { git = "https://github.com/HakanSeven12/cadcodec.git", rev = "0908da7", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
bincode = { version = "=1.3.3" }
memmap2 = { version = "=0.9.11" }
anyhow = { version = "=1.0.103" }
which = "7"
getrandom = { version = "=0.2.17" }

# Linux: link libpython explicitly because the OCS plugin runner (not Python)
# loads this cdylib and resolves symbols immediately with RTLD_NOW.
[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = { version = "0.23", features = ["abi3-py38"] }

# Windows/macOS: keep the standard PyO3 extension-module build.
[target.'cfg(not(target_os = "linux"))'.dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.186" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }

[build-dependencies]
# Must stay in sync with the runtime dependency above.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", tag = "v0.9.7", features = ["host"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
# PyO3's extension-module feature intentionally does not link libpython on Unix.
# This helper emits the macOS linker flags needed to allow unresolved Python
# symbols to be resolved at load time.
pyo3-build-config = "0.23"
