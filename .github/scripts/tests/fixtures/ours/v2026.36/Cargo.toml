[package]
name = "ocs_python_repl"
version = "0.1.25"
edition = "2021"
description = "Python REPL plugin for Open CAD Studio (API v4)."
license = "GPL-3.0-only"

[workspace]

[lib]
name = "ocs_python_repl"
crate-type = ["cdylib", "rlib"]

[features]
default = []
alloc-debug = []

# The upstream Open CAD Studio revision this plugin is pinned to.
# The repin workflow reads this file, fetches the upstream manifests at that
# revision, and rewrites the dependency pins below. Do not edit the dependency
# lines by hand; run .github/scripts/repin_gates.py (or the `repin` workflow).
[package.metadata.upstream]
tag = "v2026.36"

[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", tag = "v2026.36", features = ["host"] }
acadrust = { git = "https://github.com/HakanSeven12/cadcodec.git", rev = "5b56571a190e7a17c8f12d36390d2938b0fb72f7", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
which = "7"

[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = { version = "0.23", features = ["abi3-py38"] }

[build-dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", tag = "v2026.36", features = ["host"] }
pyo3-build-config = "0.23"

# BEGIN MIRRORED PATCH (managed by .github/scripts/repin_gates.py)
# The host workspace redirects the codec source below. The plugin mirrors the
# redirect byte for byte so both resolve the same codec build; a [patch] only
# applies from the workspace root, which is why it lives here too.
[patch."https://github.com/HakanSeven12/cadcodec.git"]
acadrust = { git = "https://git@github.com/HakanSeven12/cadcodec.git", rev = "5b56571a190e7a17c8f12d36390d2938b0fb72f7" }
# END MIRRORED PATCH
