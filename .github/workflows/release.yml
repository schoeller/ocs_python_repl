name: release

# Build the ocs_python_repl plugin cdylib for each desktop platform and attach
# the binaries plus plugin.toml to a GitHub Release.
#
# Entry points:
#   push (v* tag)    — a human pushed a release tag.
#   workflow_call    — the repin workflow invokes this after it tags a release.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Must already exist."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.python_repl-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.python_repl-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.python_repl-macos-aarch64.dylib

    runs-on: ${{ matrix.os }}

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install the host's recorded compiler
        shell: bash
        run: |
          set -euo pipefail
          # The host's Plugin Manager compares plugin.toml's rustc_version
          # with its own build-time compiler byte-for-byte; Rust has no
          # stable ABI, so the plugin must be built with the exact channel
          # record_host_build.py recorded from the host's release run.
          # rustup no longer auto-installs the toolchain named in
          # rust-toolchain.toml, so install it explicitly.
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::rust-toolchain.toml is missing — the release build must use the compiler recorded from the host build"
            exit 1
          fi
          CHANNEL=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$CHANNEL" --profile minimal
          rustc --version

      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate on the build compiler matching the host's
        shell: bash
        run: |
          set -euo pipefail
          # Fail before a multi-minute build when the toolchain or the
          # committed fingerprints cannot match the shipped host: the Plugin
          # Manager would refuse the binary as incompatible.
          python3 .github/scripts/repin_gates.py verify-fingerprints \
            --plugin-toml plugin.toml \
            --host-build host-build.json \
            --rustc-version "$(rustc --version)"

      - name: Build release cdylib
        shell: bash
        env:
          PYO3_PYTHON: python
        # --locked: the re-pin workflow commits a complete cross-target
        # lockfile (it runs cargo check --target for Windows and macOS), so a
        # manifest bump without a refreshed lockfile must fail here rather
        # than silently resolve something else.
        run: cargo build --release --locked

      - name: Verify Linux plugin links libpython
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          so=target/release/libocs_python_repl.so
          echo "Dynamic dependencies:"
          readelf -d "$so" | grep -E 'NEEDED|RPATH|RUNPATH'
          echo ""
          echo "Python symbol check:"
          if readelf -d "$so" | grep -q 'libpython'; then
            echo "OK: $so links libpython"
          else
            echo "ERROR: $so does not link libpython; OCS runner will fail to load it on Linux"
            exit 1
          fi

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          cp plugin.toml dist/plugin.toml

      - name: Inject release fingerprints into plugin.toml
        shell: bash
        run: |
          # Both fingerprints the host's Plugin Manager gates API v4+ plugins
          # on: the resolved source of whatever crate carries the entity
          # types at this pin (acadrust, renamed opencadcodec at host
          # v2026.39) — discovered from Cargo.toml's dependency, never
          # hardcoded — and the full compiler line of this build, which the
          # toolchain gate above proved equals the host's. Same code path
          # the re-pin workflow uses.
          python3 .github/scripts/repin_gates.py inject-source \
            --plugin-toml dist/plugin.toml \
            --our-lock Cargo.lock \
            --cargo Cargo.toml \
            --rustc-version "$(rustc --version)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
