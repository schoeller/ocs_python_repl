name: release

# Build the ocs_python_repl plugin cdylib for each desktop platform and attach
# the binaries plus plugin.toml to a GitHub Release.
#
# Entry points:
#   push (v* tag)    — a human pushed a release tag.
#   workflow_call    — the repin workflow invokes this after it tags a release.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.python_repl-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.python_repl-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.python_repl-macos-aarch64.dylib

    runs-on: ${{ matrix.os }}

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release cdylib
        shell: bash
        env:
          PYO3_PYTHON: python
        run: cargo build --release --locked

      - name: Verify Linux plugin links libpython
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          so=target/release/libocs_python_repl.so
          echo "Dynamic dependencies:"
          readelf -d "$so" | grep -E 'NEEDED|RPATH|RUNPATH'
          echo ""
          echo "Python symbol check:"
          if readelf -d "$so" | grep -q 'libpython'; then
            echo "OK: $so links libpython"
          else
            echo "ERROR: $so does not link libpython; OCS runner will fail to load it on Linux"
            exit 1
          fi

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          cp plugin.toml dist/plugin.toml

      - name: Inject acadrust fingerprint into plugin.toml
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          plugin_path = Path("dist/plugin.toml")
          lock_path = Path("Cargo.lock")

          lock = lock_path.read_text(encoding="utf-8")
          m = re.search(r'^name = "acadrust"\n^version = "[^"]+"\n^source = "([^"]+)"', lock, re.M)
          if not m:
              raise SystemExit("acadrust source not found in Cargo.lock")
          source = m.group(1)

          text = plugin_path.read_text(encoding="utf-8")
          if "[opencad]" not in text:
              text = text.rstrip() + "\n\n[opencad]\n"
          text, n = re.subn(
              r'^(\[opencad\]\s*\n)(?:acadrust_source\s*=\s*"[^"]*"\s*\n)?',
              rf'\g<1>acadrust_source = "{source}"\n',
              text,
              flags=re.M,
          )
          if n == 0:
              text = re.sub(
                  r'^(\[opencad\]\s*\n)',
                  rf'\g<1>acadrust_source = "{source}"\n',
                  text,
                  flags=re.M,
              )
          plugin_path.write_text(text, encoding="utf-8")
          print(f"acadrust_source = {source}")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
