name: release

# Build the ocs_python_repl plugin cdylib for each desktop platform and attach
# the binaries plus plugin.toml to a GitHub Release when a v* tag is pushed.
# Open CAD Studio's Plugin Manager reads the release assets, picks the one
# matching the user's OS/arch, and installs it.
#
# Two entry points:
#
#   push (v* tag)  — a human tagged by hand.
#   workflow_call  — an automated caller (e.g. a repin bot) can invoke this
#                    workflow directly, because tags pushed by GITHUB_TOKEN do
#                    not fire push triggers.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.python_repl-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.python_repl-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.python_repl-macos-aarch64.dylib

    runs-on: ${{ matrix.os }}

    env:
      # `inputs` is unset on the push path, so this resolves to the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      # A release whose tag disagrees with the manifests ships a plugin that
      # reports the wrong version to the Plugin Manager. Catch it before the
      # assets are built.
      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cargo.toml is the single source of truth for upstream pins; the release
      # build must not patch or override dependency declarations.
      - name: Build release cdylib
        shell: bash
        env:
          PYO3_PYTHON: python
        run: cargo build --release --locked

      - name: Verify Linux plugin links libpython
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          so=target/release/libocs_python_repl.so
          echo "Dynamic dependencies:"
          readelf -d "$so" | grep -E 'NEEDED|RPATH|RUNPATH'
          echo ""
          echo "Python symbol check:"
          if readelf -d "$so" | grep -q 'libpython'; then
            echo "OK: $so links libpython"
          else
            echo "ERROR: $so does not link libpython; OCS runner will fail to load it on Linux"
            exit 1
          fi

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          # The cdylib name varies by platform (lib*.so / *.dll / lib*.dylib);
          # the host loader accepts any name with the right extension.
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          cp plugin.toml dist/plugin.toml

      # Rewrite the staged plugin.toml with the exact acadrust revision the
      # release was built against so the host can verify ABI compatibility
      # before loading any native code.
      - name: Inject acadrust fingerprint into plugin.toml
        run: python scripts/inject_acadrust_metadata.py dist/plugin.toml

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
