name: repin

# Watch upstream Open CAD Studio releases and re-pin this plugin when a new
# release tag appears. The Python REPL plugin must be built against the exact
# same `ocs_plugin_api` commit, `acadrust` rev, and registry dependency versions
# as the shipped host, because the V4 shared-memory snapshot and the plugin-host
# wire protocol are laid out by those crates. A mismatch produces the kind of
# `slice::from_raw_parts` / ABI crash seen when the plugin and host were built
# from different commits.
#
# The single source of truth for the upstream pin is `.upstream-tag` at the
# repository root. It may contain either a release tag (e.g. `v0.9.7`) or a full
# git revision. This workflow reads that file, fetches the upstream Cargo.lock at
# the corresponding ref, and rewrites `Cargo.toml` (and `Cargo.lock`) with the
# matching dependency pins. Manual re-pins can be done with `scripts/repin.py`.
#
# Two entry points:
#
#   schedule (cron)     — nightly check against the latest upstream release.
#                         If the current pin is a git revision, the cron job
#                         does not auto-repin; use workflow_dispatch instead.
#   workflow_dispatch   — manual re-pin to a chosen upstream tag or rev, or a dry run.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to re-pin to (default: value from .upstream-tag)"
        required: false
      dry_run:
        description: "Run every gate but stop before merge/tag/release"
        type: boolean
        default: false

concurrency:
  group: repin
  cancel-in-progress: false

env:
  UPSTREAM: HakanSeven12/OpenCADStudio

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      repin: ${{ steps.check.outputs.repin }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare desired upstream ref against the current pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          CURRENT_REF=$(cat .upstream-tag | tr -d '[:space:]')
          # Treat 7+ hex chars as a git revision; everything else is a tag.
          IS_SHA=0
          if [[ "$CURRENT_REF" =~ ^[0-9a-fA-F]{7,}$ ]]; then
            IS_SHA=1
          fi

          if [ -n "$INPUT_TAG" ]; then
            # Manual workflow_dispatch override.
            REF="$INPUT_TAG"
            echo "using workflow_dispatch ref=$REF"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$IS_SHA" = "1" ]; then
              echo "current pin is a revision ($CURRENT_REF); skipping automatic cron repin"
              echo "repin=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Nightly poll: compare the latest upstream release to our pin.
            REF=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
            echo "cron poll: latest upstream release=$REF; current pin=$CURRENT_REF"
          else
            # Fallback: re-pin to the current .upstream-tag value (useful for dry runs).
            REF="$CURRENT_REF"
            echo "fallback: using current .upstream-tag=$REF"
          fi

          # Validate the ref exists upstream and resolve its commit SHA.
          SHA=$(gh api "repos/$UPSTREAM/commits/$REF" --jq .sha)
          echo "desired upstream ref=$REF ($SHA); current pinned ref=$CURRENT_REF"

          if [ "$REF" = "$CURRENT_REF" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Pin is current — nothing to do."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REF" = "$CURRENT_REF" ]; then
            echo "::notice::dry run against the current pin — gates will run, nothing will ship."
          fi

          if [ "$DRY_RUN" != "true" ] \
             && git ls-remote --exit-code origin "refs/heads/repin/$REF" >/dev/null 2>&1; then
            echo "Branch repin/$REF already exists — PR pending or handled."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "repin=true" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

  repin:
    needs: detect
    if: needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.ship.outputs.release_tag }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: repin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture current acadrust pin
        id: old_pins
        run: |
          set -euo pipefail
          old_url=$(grep -m1 '^acadrust = ' Cargo.toml | grep -oP 'git = "\K[^"]+' || true)
          old_rev=$(grep -m1 '^acadrust = ' Cargo.toml | grep -oP 'rev = "\K[^"]+' || true)
          echo "old_acadrust_url=$old_url" >> "$GITHUB_OUTPUT"
          echo "old_acadrust_rev=$old_rev" >> "$GITHUB_OUTPUT"
          echo "old acadrust: $old_url @ $old_rev"

      - name: Derive new pins from the upstream tag
        id: pins
        run: |
          set -euo pipefail

          gh api "repos/$UPSTREAM/contents/Cargo.lock?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.lock

          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-ocs_plugin_api-Cargo.toml

          # Write a Python helper script that parses the upstream Cargo.lock
          # and ocs_plugin_api/Cargo.toml, then rewrites Cargo.toml with matching pins.
          cat > /tmp/repin.py <<'PYEOF'
          import os
          re = __import__("re")
          tomli = None
          try:
              import tomllib as tomli
          except ImportError:
              try:
                  import tomli
              except ImportError:
                  pass

          UPSTREAM = os.environ["UPSTREAM"]
          TAG = os.environ["TAG"]

          lock_text = open("/tmp/host-Cargo.lock").read()
          api_toml_text = open("/tmp/host-ocs_plugin_api-Cargo.toml").read()

          def lock_packages(text):
              """Yield (name, version, source) blocks from a Cargo.lock."""
              blocks = re.split(r"\n\[\[package\]\]\n", text)
              for block in blocks:
                  name = re.search(r'^name = "([^"]+)"', block, re.M)
                  version = re.search(r'^version = "([^"]+)"', block, re.M)
                  source = re.search(r'^source = "([^"]+)"', block, re.M)
                  if name and version:
                      yield name.group(1), version.group(1), source.group(1) if source else None

          def upstream_direct_deps(text, package_name="ocs_plugin_api"):
              """Return name -> version for a package's direct deps from Cargo.lock.

              We parse the ocs_plugin_api block so we match the versions the host
              contract actually uses, rather than versions pulled in by unrelated
              workspace crates.
              """
              pattern = re.compile(
                  rf'^name = "{re.escape(package_name)}"\s*\n'
                  r'^version = "[^"]+"\s*\n'
                  r'(?:^source = "[^"]+"\s*\n)?'
                  r'^dependencies = \[(.*?)\]',
                  re.M | re.S,
              )
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f"could not find {package_name} package in upstream Cargo.lock")
              deps_text = m.group(1)
              deps = {}
              for line in deps_text.splitlines():
                  line = line.strip().rstrip(",")
                  if not line:
                      continue
                  parts = line.strip('"').split()
                  if len(parts) == 1:
                      deps[parts[0]] = ""
                  else:
                      deps[parts[0]] = parts[1]
              return deps

          packages = {name: (ver, src) for name, ver, src in lock_packages(lock_text)}
          direct_deps = upstream_direct_deps(lock_text)

          def pkg_version(name):
              if name in direct_deps and direct_deps[name]:
                  return direct_deps[name]
              if name not in packages:
                  raise SystemExit(f"{name} not found in upstream Cargo.lock")
              return packages[name][0]

          def acadrust_rev_from_api_toml(text):
              """Return (git_url, rev) for acadrust from ocs_plugin_api/Cargo.toml.

              Cargo unifies git sources by their exact reference string, so we must
              use the same rev form upstream uses (e.g. a short hash), not the full
              40-char hash from Cargo.lock.
              """
              for line in text.splitlines():
                  line = line.split("#", 1)[0].strip()
                  if "acadrust" not in line:
                      continue
                  m = re.search(r'git\s*=\s*"([^"]+)"', line)
                  if not m:
                      continue
                  url = m.group(1)
                  m = re.search(r'rev\s*=\s*"([^"]+)"', line)
                  if not m:
                      raise SystemExit(f"acadrust dependency has no rev: {line}")
                  return url, m.group(1)
              raise SystemExit("could not find acadrust dependency in ocs_plugin_api/Cargo.toml")

          # ocs_plugin_api lives in the upstream repo itself, so pin by the same ref.
          ocs_api_url = f"https://github.com/{UPSTREAM}"

          # acadrust is a separate git repo; pin to the exact upstream rev form.
          acad_url, acad_rev = acadrust_rev_from_api_toml(api_toml_text)

          cargo_path = "Cargo.toml"
          cargo = open(cargo_path).read()

          def is_sha(ref):
              return len(ref) >= 7 and all(c in "0123456789abcdef" for c in ref.lower())

          def metadata_key(ref):
              return "rev" if is_sha(ref) else "tag"

          key = metadata_key(TAG)

          # Replace the metadata ref (tag or rev).
          cargo, n = re.subn(
              rf'^(\[package\.metadata\.upstream\]\s*\n^{key} = ")[^"]+("\s*)$',
              rf'\g<1>{TAG}\g<2>',
              cargo,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(f"expected 1 upstream metadata {key} to rewrite, rewrote {n}")

          def replace_dep(cargo, name, new_value):
              pattern = rf'^{name} = \{{[^}}]+\}}'
              cargo, n = re.subn(pattern, f'{name} = {new_value}', cargo, flags=re.M)
              if n == 0:
                  raise SystemExit(f"dependency {name} not found in Cargo.toml")
              return cargo

          # ocs_plugin_api: git by tag or rev, both runtime and build-dep.
          ocs_api_value = f'{{ git = "{ocs_api_url}", {key} = "{TAG}", features = ["host"] }}'
          cargo = replace_dep(cargo, "ocs_plugin_api", ocs_api_value)

          # acadrust: git by rev.
          acad_value = f'{{ git = "{acad_url}", rev = "{acad_rev}", features = ["serde"] }}'
          cargo = replace_dep(cargo, "acadrust", acad_value)

          # Registry dependencies: pin to the exact upstream version.
          registry_pins = {
              "serde": f'{{ version = "={pkg_version("serde")}", features = ["derive"] }}',
              "serde_json": f'{{ version = "={pkg_version("serde_json")}" }}',
              "bincode": f'{{ version = "={pkg_version("bincode")}" }}',
              "memmap2": f'{{ version = "={pkg_version("memmap2")}" }}',
              "anyhow": f'{{ version = "={pkg_version("anyhow")}" }}',
              "getrandom": f'{{ version = "={pkg_version("getrandom")}" }}',
              "libc": f'{{ version = "={pkg_version("libc")}" }}',
          }
          windows_sys_version = pkg_version("windows-sys")
          registry_pins["windows-sys"] = (
              f'{{ version = "={windows_sys_version}", '
              f'features = ["Win32_Foundation", "Win32_System_Threading", '
              f'"Win32_System_JobObjects", "Win32_System_Diagnostics", '
              f'"Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }}'
          )

          for dep_name, dep_value in registry_pins.items():
              cargo = replace_dep(cargo, dep_name, dep_value)

          # Update .upstream-tag to match.
          open(".upstream-tag", "w").write(TAG + "\n")

          open(cargo_path, "w").write(cargo)

          print(f"HOST_TAG={TAG}")
          print(f"ACADRUST_URL={acad_url}")
          print(f"ACADRUST_REV={acad_rev}")
          print(f"SERDE={pkg_version('serde')}")
          print(f"SERDE_JSON={pkg_version('serde_json')}")
          print(f"BINCODE={pkg_version('bincode')}")
          print(f"MEMMAP2={pkg_version('memmap2')}")
          print(f"ANYHOW={pkg_version('anyhow')}")
          print(f"GETRANDOM={pkg_version('getrandom')}")
          print(f"LIBC={pkg_version('libc')}")
          print(f"WINDOWS_SYS={pkg_version('windows-sys')}")
          PYEOF

          python3 /tmp/repin.py >> "$GITHUB_ENV"
          echo "host_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "acadrust_url=$ACADRUST_URL" >> "$GITHUB_OUTPUT"
          echo "acadrust_rev=$ACADRUST_REV" >> "$GITHUB_OUTPUT"
          cat Cargo.toml

      - name: Gate on the plugin API version handshake
        id: apiver
        run: |
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/src/manifest.rs?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/manifest.rs
          MAX=$(grep -oP 'API_VERSION: u32 = \K\d+' /tmp/manifest.rs)
          MIN=$(grep -oP 'API_VERSION_MIN_SUPPORTED: u32 = \K\d+' /tmp/manifest.rs)
          OURS=$(grep -oP 'api_version = \K\d+' plugin.toml)
          echo "host accepts [$MIN, $MAX]; plugin declares $OURS"
          if [ "$OURS" -lt "$MIN" ] || [ "$OURS" -gt "$MAX" ]; then
            echo "::error::Host $TAG no longer accepts api_version=$OURS — a source migration is needed, not a re-pin."
            exit 1
          fi
          echo "api_version=$MAX" >> "$GITHUB_OUTPUT"
          if [ "$OURS" != "$MAX" ]; then
            echo "::notice::api_version $OURS -> $MAX (host $TAG exports API_VERSION=$MAX)"
          fi

      - name: Bump the plugin patch version
        id: bump
        env:
          API_VERSION: ${{ steps.apiver.outputs.api_version }}
        run: |
          NEWVER=$(python3 - <<'EOF'
          import re
          cargo = open("Cargo.toml").read()
          ver = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', cargo, re.M).groups()
          new = f"{ver[0]}.{ver[1]}.{int(ver[2]) + 1}"
          cargo = re.sub(r'^version = "[\d.]+"', f'version = "{new}"', cargo, count=1, flags=re.M)
          open("Cargo.toml", "w").write(cargo)

          plug = open("plugin.toml").read()
          plug = re.sub(r'^version = "[\d.]+"', f'version = "{new}"', plug, count=1, flags=re.M)
          plug = re.sub(r"^api_version = \d+", f"api_version = {os.environ['API_VERSION']}", plug, count=1, flags=re.M)
          open("plugin.toml", "w").write(plug)
          print(new)
          EOF
          )
          echo "newver=$NEWVER" >> "$GITHUB_OUTPUT"
          git diff

      - name: Gate on the diff being purely mechanical
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          UNEXPECTED=$(git diff --name-only \
            | grep -vE '^(Cargo\.toml|plugin\.toml|Cargo\.lock|\.upstream-tag)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::re-pin touched files beyond the manifests: $UNEXPECTED"
            exit 1
          fi

      - name: Build and test the plugin against the new pins
        env:
          PYO3_PYTHON: python
        run: |
          cargo generate-lockfile
          cargo build --release --locked
          cargo test --locked -- --ignored

      - name: Build the host at the release tag
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
          git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM" host
          cargo build --manifest-path host/Cargo.toml

      - name: Smoke test — headless host loads the plugin
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/plugins/opencad.python_repl"
          cp plugin.toml target/release/libocs_python_repl.so "$STAGE/plugins/opencad.python_repl/"
          {
            echo '{"op":"new"}'
            echo '{"op":"entities"}'
          } | OCS_PLUGINS_DIR="$STAGE/plugins" host/target/debug/OpenCADStudio --serve \
            | tee /tmp/serve.out
          python3 - <<'EOF'
          import json
          replies = [json.loads(l) for l in open("/tmp/serve.out") if l.startswith("{")]
          assert replies[0].get("ready"), "host did not report ready"
          assert replies[1].get("ok"), "new command failed"
          assert replies[2].get("ok"), "entities command failed"
          print("smoke test OK: host loaded the plugin and served commands")
          EOF

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::dry run: every gate passed. Nothing merged, tagged or released."
          echo "### Dry run — all gates green" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was merged, tagged or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the re-pin PR
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          HOST_TAG: ${{ steps.pins.outputs.host_tag }}
          ACADRUST_URL: ${{ steps.pins.outputs.acadrust_url }}
          ACADRUST_REV: ${{ steps.pins.outputs.acadrust_rev }}
          OLD_ACADRUST_URL: ${{ steps.old_pins.outputs.old_acadrust_url }}
          OLD_ACADRUST_REV: ${{ steps.old_pins.outputs.old_acadrust_rev }}
          NEWVER: ${{ steps.bump.outputs.newver }}
          API_VERSION: ${{ steps.apiver.outputs.api_version }}
        run: |
          set -euo pipefail
          ACAD_SHORT=${ACADRUST_REV:0:7}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "repin/$TAG"
          git add Cargo.toml plugin.toml .upstream-tag
          git add -f Cargo.lock
          git commit -m "release: v$NEWVER — re-pin to host $TAG (acadrust $ACAD_SHORT)" \
            -m "Automated re-pin per the rebuild rule."
          git push origin "repin/$TAG"

          gh pr create \
            --title "release: v$NEWVER — re-pin to host $TAG (acadrust $ACAD_SHORT)" \
            --body "Automated re-pin: upstream released [\`$TAG\`](https://github.com/$UPSTREAM/releases/tag/$TAG).

          | pin | old | new |
          |---|---|---|
          | \`ocs_plugin_api\` | (previous) | \`$HOST_TAG\` |
          | \`acadrust\` repo | \`$OLD_ACADRUST_URL\` | \`$ACADRUST_URL\` |
          | \`acadrust\` rev | \`$OLD_ACADRUST_REV\` | \`$ACADRUST_REV\` |
          | \`api_version\` | (previous) | \`$API_VERSION\` |

          **Checks run in this workflow:** api-version gate, \`cargo build --release --locked\`, \`cargo test --locked\`, and a headless host smoke test (host built at \`$TAG\` loads the plugin and serves \`new\` / \`entities\`).

          Every gate passed, so this PR is merged and released automatically by the run that opened it."

      - name: Merge and tag
        if: ${{ !inputs.dry_run }}
        id: ship
        env:
          NEWVER: ${{ steps.bump.outputs.newver }}
        run: |
          set -euo pipefail
          gh pr merge "repin/$TAG" --merge --delete-branch
          git fetch origin main
          MERGE_SHA=$(git rev-parse origin/main)
          git tag "v$NEWVER" "$MERGE_SHA"
          git push origin "v$NEWVER"
          echo "tagged v$NEWVER at $MERGE_SHA"
          echo "release_tag=v$NEWVER" >> "$GITHUB_OUTPUT"

  release:
    needs: repin
    if: needs.repin.outputs.release_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.repin.outputs.release_tag }}

  escalate:
    needs: [detect, repin]
    if: failure() && needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the escalation issue
        run: |
          set -euo pipefail
          TITLE="repin blocked: host $TAG needs a human"
          BODY=$(cat <<EOF
          The automated re-pin to upstream \`$TAG\` did not pass its gates, so nothing was merged, tagged or released.

          **Run:** $RUN_URL

          The bot ships a re-pin on its own only while the change stays mechanical. One of these stopped it:

          - the host no longer accepts our \`api_version\` (source migration)
          - the plugin no longer compiles against the new contract
          - \`cargo build --release --locked\` or \`cargo test --locked\` failed
          - the headless host smoke test failed
          - the diff reached beyond \`Cargo.toml\` / \`plugin.toml\` / \`Cargo.lock\` / \`.upstream-tag\`

          Open the run log above; the failing step names which one and why.
          EOF
          )
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still blocked as of $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
