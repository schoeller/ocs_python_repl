name: repin

# Re-pin this plugin to an upstream OpenCADStudio release tag.
#
# The workflow fetches the upstream Cargo.lock, Cargo.toml and
# crates/ocs_plugin_api/Cargo.toml at the requested tag, then:
#
#   1. Rewrites .upstream-tag, Cargo.toml and Cargo.lock to match the host tree.
#   2. Verifies every dependency used by the plugin also exists in the upstream
#      Cargo.lock at the same version.
#   3. Overwrites acadrust_source in plugin.toml with the resolved upstream value.
#   4. Builds the plugin and runs its tests.
#   5. Builds the upstream host at the same tag and smoke-tests that the host
#      loads the re-pinned plugin.
#   6. Bumps the plugin patch version, merges the change, tags it and triggers a
#      release.
#
# Entry points:
#   workflow_dispatch  — manual re-pin, optional dry run.
#   workflow_call      — invoked by the nightly-check workflow.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream OpenCADStudio release tag (e.g. v0.9.8)"
        required: true
        type: string
      dry_run:
        description: "Run all gates but stop before committing/tagging/releasing"
        type: boolean
        default: false
env:
  UPSTREAM_REPO: HakanSeven12/OpenCADStudio

concurrency:
  group: repin
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.ship.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: repin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch upstream manifests at the requested tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          gh api "repos/$UPSTREAM_REPO/contents/Cargo.lock?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream/Cargo.lock
          gh api "repos/$UPSTREAM_REPO/contents/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream/Cargo.toml
          gh api "repos/$UPSTREAM_REPO/contents/crates/ocs_plugin_api/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream/ocs_plugin_api.Cargo.toml
          echo "Fetched upstream manifests at $TAG"

      - name: Re-pin local Cargo.toml and Cargo.lock
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: python - <<'PY'
          import re
          from pathlib import Path

          repo = Path.cwd()
          upstream_lock = Path("/tmp/upstream/Cargo.lock").read_text(encoding="utf-8")
          upstream_repo = "HakanSeven12/OpenCADStudio"
          tag = "${{ inputs.upstream_tag }}"

          # Extract the resolved acadrust source from the upstream lockfile.
          m = re.search(
              r'^name = "acadrust"\n'
              r'^version = "([^"]+)"\n'
              r'^source = "git\+([^?]+)\?rev=([^#]+)',
              upstream_lock,
              re.M,
          )
          if not m:
              raise SystemExit("acadrust not found in upstream Cargo.lock")
          acad_url = m.group(2)
          acad_rev = m.group(3)
          plain_acad_url = acad_url.replace("https://git@", "https://")
          print(f"acadrust resolved source: {acad_url} @ {acad_rev}")

          # Update local Cargo.toml.
          cargo_path = repo / "Cargo.toml"
          cargo = cargo_path.read_text(encoding="utf-8")

          # metadata upstream tag
          cargo, n = re.subn(
              r'^(\[package\.metadata\.upstream\]\s*\n)(?:tag|rev) = "[^"]+"[ \t]*\n',
              rf'\g<1>tag = "{tag}"\n',
              cargo,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(f"expected 1 upstream metadata entry, rewrote {n}")

          # ocs_plugin_api runtime + build dependency
          ocs_value = f'{{ git = "https://github.com/{upstream_repo}", tag = "{tag}", features = ["host"] }}'
          cargo, n = re.subn(
              r'^ocs_plugin_api = \{[^}]+\}',
              f'ocs_plugin_api = {ocs_value}',
              cargo,
              count=2,
              flags=re.M,
          )
          if n != 2:
              raise SystemExit(f"expected 2 ocs_plugin_api entries, rewrote {n}")

          # acadrust direct dependency (plain URL, no git@). The rev is taken from
          # the upstream resolved lockfile so Cargo.toml and Cargo.lock agree.
          acad_value = f'{{ git = "{plain_acad_url}", rev = "{acad_rev}", features = ["serde"] }}'
          cargo, n = re.subn(
              r'^acadrust = \{[^}]+\}',
              f'acadrust = {acad_value}',
              cargo,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(f"expected 1 acadrust dependency entry, rewrote {n}")

          # Remove any existing cadcodec patch section and append a fresh one.
          # The patch must use a URL that Cargo considers a different source from
          # the plain dependency URL, so we use the git@ form the host uses.
          cargo = re.sub(
              r'\n?# The upstream host workspace patches acadrust[^\n]*\n'
              r'(?:# [^\n]*\n)*'
              r'\[patch\."https://github\.com/HakanSeven12/cadcodec\.git"\]\n'
              r'acadrust\s*=\s*\{[^}]+\}\s*\n?',
              "\n",
              cargo,
              flags=re.M,
          )
          patch_section = (
              f'\n# The upstream host workspace patches acadrust to a newer revision than the one\n'
              f'# declared by ocs_plugin_api. Without this patch, ocs_plugin_api would resolve\n'
              f'# its own acadrust revision independently and the plugin would see two different\n'
              f'# acadrust crates, breaking the ABI contract.\n'
              f'[patch."https://github.com/HakanSeven12/cadcodec.git"]\n'
              f'acadrust = {{ git = "{acad_url}", rev = "{acad_rev}" }}\n'
          )
          cargo = cargo.rstrip() + "\n" + patch_section
          cargo_path.write_text(cargo, encoding="utf-8")

          # Update .upstream-tag.
          (repo / ".upstream-tag").write_text(tag + "\n", encoding="utf-8")

          # Merge upstream Cargo.lock into the local lockfile.
          local_lock = (repo / "Cargo.lock").read_text(encoding="utf-8")

          header_match = re.match(r'(#.*?\nversion = \d+\n)', upstream_lock, re.S)
          header = header_match.group(1) if header_match else (
              "# This file is automatically @generated by Cargo.\n"
              "# It is not intended for manual editing.\n"
              "version = 4\n"
          )
          upstream_blocks = re.findall(
              r'\[\[package\]\]\n(.*?(?=\n\[\[package\]\]\n|$))',
              upstream_lock,
              re.S,
          )
          upstream_blocks = [b.strip() for b in upstream_blocks]

          local_blocks = re.split(r"\n\[\[package\]\]\n", local_lock)
          plugin_specific = {
              "which", "pyo3", "pyo3-build-config", "pyo3-ffi",
              "pyo3-macros", "pyo3-macros-backend",
          }
          keep_blocks = []
          ocs_python_repl_block = None
          for block in local_blocks:
              m = re.search(r'^name = "([^"]+)"', block, re.M)
              if not m:
                  continue
              name = m.group(1)
              if name in plugin_specific:
                  keep_blocks.append(block.strip())
              elif name == "ocs_python_repl":
                  ocs_python_repl_block = block.strip()

          blocks = []
          for b in upstream_blocks:
              if b.startswith('name = "OpenCADStudio"'):
                  if ocs_python_repl_block:
                      blocks.append(ocs_python_repl_block)
              else:
                  blocks.append(b)
          if not ocs_python_repl_block:
              raise SystemExit("ocs_python_repl package not found in local Cargo.lock")
          blocks.extend(keep_blocks)

          new_lock = header + "\n[[package]]\n" + "\n[[package]]\n".join(blocks) + "\n"
          (repo / "Cargo.lock").write_text(new_lock, encoding="utf-8")
          print(f"Wrote merged Cargo.lock: {len(upstream_blocks)} upstream blocks + {len(keep_blocks)} plugin blocks")
        PY

      - name: Resolve plugin lockfile and build the release cdylib
        env:
          PYO3_PYTHON: python
        run: |
          # Cargo may need to add or prune a handful of plugin-specific entries.
          # Build the release profile without --locked so the merged upstream
          # lockfile can be adjusted once; the remaining steps enforce --locked.
          cargo build --release

      - name: Verify all dependencies match the upstream tree
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: python - <<'PY'
          import re
          import sys
          from pathlib import Path

          upstream = Path("/tmp/upstream/Cargo.lock").read_text(encoding="utf-8")
          local = Path("Cargo.lock").read_text(encoding="utf-8")

          def parse(text):
              blocks = re.findall(r'\[\[package\]\]\n(.*?(?=\n\[\[package\]\]\n|$))', text, re.S)
              pkgs = {}
              for b in blocks:
                  name = re.search(r'^name = "([^"]+)"', b, re.M)
                  ver = re.search(r'^version = "([^"]+)"', b, re.M)
                  if name and ver:
                      pkgs.setdefault(name.group(1), set()).add(ver.group(1))
              return pkgs

          up = parse(upstream)
          loc = parse(local)

          plugin_only = {
              "ocs_python_repl", "which", "pyo3", "pyo3-build-config",
              "pyo3-ffi", "pyo3-macros", "pyo3-macros-backend",
          }
          mismatches = []
          for name, lvers in sorted(loc.items()):
              if name in plugin_only:
                  continue
              if name not in up:
                  continue
              for lv in lvers:
                  if lv not in up[name]:
                      mismatches.append(f"{name} {lv} (upstream has {sorted(up[name])})")

          if mismatches:
              print("Dependency mismatch with upstream Cargo.lock:", file=sys.stderr)
              for m in mismatches:
                  print(f"  {m}", file=sys.stderr)
              sys.exit(1)

          print("All overlapping dependencies match the upstream Cargo.lock.")
        PY

      - name: Inject acadrust fingerprint into plugin.toml
        run: python - <<'PY'
          import re
          from pathlib import Path

          repo = Path.cwd()
          lock = (repo / "Cargo.lock").read_text(encoding="utf-8")
          m = re.search(r'^name = "acadrust"\n^version = "[^"]+"\n^source = "([^"]+)"', lock, re.M)
          if not m:
              raise SystemExit("acadrust source not found in local Cargo.lock")
          source = m.group(1)

          plugin = repo / "plugin.toml"
          text = plugin.read_text(encoding="utf-8")
          if "[opencad]" not in text:
              text = text.rstrip() + "\n\n[opencad]\n"
          text, n = re.subn(
              r'^(\[opencad\]\s*\n)(?:acadrust_source\s*=\s*"[^"]*"\s*\n)?',
              rf'\g<1>acadrust_source = "{source}"\n',
              text,
              flags=re.M,
          )
          if n == 0:
              text = re.sub(
                  r'^(\[opencad\]\s*\n)',
                  rf'\g<1>acadrust_source = "{source}"\n',
                  text,
                  flags=re.M,
              )
          plugin.write_text(text, encoding="utf-8")
          print(f"plugin.toml acadrust_source = {source}")
        PY

      - name: Test the plugin against the resolved lockfile
        env:
          PYO3_PYTHON: python
        run: |
          set -euo pipefail
          cargo test --locked

      - name: Build the upstream host at the release tag
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
          git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM_REPO" /tmp/upstream-repo
          cargo build --manifest-path /tmp/upstream-repo/Cargo.toml

      - name: Smoke test — headless host loads the re-pinned plugin
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/plugins/opencad.python_repl"
          cp plugin.toml "$STAGE/plugins/opencad.python_repl/"
          cp target/release/libocs_python_repl.so "$STAGE/plugins/opencad.python_repl/"
          {
            echo '{"op":"new"}'
            echo '{"op":"entities"}'
          } | OCS_PLUGINS_DIR="$STAGE/plugins" /tmp/upstream-repo/target/debug/OpenCADStudio --serve \
            | tee /tmp/serve.out
          python3 - <<'PY'
          import json
          replies = [json.loads(l) for l in open("/tmp/serve.out") if l.startswith("{")]
          assert replies[0].get("ready"), "host did not report ready"
          assert replies[1].get("ok"), "new command failed"
          assert replies[2].get("ok"), "entities command failed"
          print("smoke test OK: host loaded the plugin and served commands")
          PY

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::dry run: all gates passed. Nothing committed, tagged or released."
          echo "### Dry run — all gates green" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was committed, tagged or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Bump plugin patch version
        if: ${{ !inputs.dry_run }}
        id: bump
        run: python - <<'PY'
          import os
          import re
          from pathlib import Path

          repo = Path.cwd()

          cargo = (repo / "Cargo.toml").read_text(encoding="utf-8")
          ver = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', cargo, re.M)
          if not ver:
              raise SystemExit("could not read version from Cargo.toml")
          major, minor, patch = ver.groups()
          new = f"{major}.{minor}.{int(patch) + 1}"
          cargo = re.sub(
              r'^version = "[\d.]+"',
              f'version = "{new}"',
              cargo,
              count=1,
              flags=re.M,
          )
          (repo / "Cargo.toml").write_text(cargo, encoding="utf-8")

          plugin = (repo / "plugin.toml").read_text(encoding="utf-8")
          plugin = re.sub(
              r'^version = "[\d.]+"',
              f'version = "{new}"',
              plugin,
              count=1,
              flags=re.M,
          )
          (repo / "plugin.toml").write_text(plugin, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"newver={new}\n")
          print(f"bumped plugin version to {new}")
        PY

      - name: Open PR, merge, tag and trigger release
        if: ${{ !inputs.dry_run }}
        id: ship
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.upstream_tag }}
          NEWVER: ${{ steps.bump.outputs.newver }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="repin/$TAG"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock plugin.toml .upstream-tag
          git commit -m "release: v$NEWVER — re-pin to host $TAG" \
            -m "Upstream acadrust resolved to the revision patched by the host tree." \
            -m "All overlapping dependencies were verified against the upstream Cargo.lock."
          git push origin "$branch"

          gh pr create \
            --title "release: v$NEWVER — re-pin to host $TAG" \
            --body "Automated re-pin to upstream [\`$TAG\`](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG).\n\n          Every gate passed: dependency verification, \`cargo build --release\`, \`cargo test --locked\`, and a headless host smoke test (host built at \`$TAG\` loads the plugin)."

          gh pr merge "$branch" --merge --delete-branch

          git fetch origin main
          merge_sha=$(git rev-parse origin/main)
          git tag "v$NEWVER" "$merge_sha"
          git push origin "v$NEWVER"

          echo "release_tag=v$NEWVER" >> "$GITHUB_OUTPUT"
          echo "tagged v$NEWVER at $merge_sha"

  release:
    needs: repin
    if: needs.repin.outputs.release_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.repin.outputs.release_tag }}

  escalate:
    needs: repin
    if: failure() && needs.repin.outputs.release_tag == '' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TAG: ${{ inputs.upstream_tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the escalation issue
        run: |
          set -euo pipefail
          title="repin blocked: host $TAG needs a human"
          body=$(cat <<EOF
          The automated re-pin to upstream \`$TAG\` did not pass its gates, so nothing was merged, tagged or released.

          **Run:** $RUN_URL

          Possible causes:

          - a dependency used by the plugin does not match the upstream Cargo.lock
          - the plugin no longer compiles against the new upstream acadrust/ocs_plugin_api contract
          - \`cargo build --release\` or \`cargo test --locked\` failed
          - the headless host smoke test failed
          - the diff reached beyond the expected manifests

          Open the run log above for the failing step and its cause.
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still blocked as of $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
