name: repin

# Nightly re-pin of this plugin to the latest upstream OpenCADStudio release.
#
# The gates live in .github/scripts/repin_gates.py (unit-tested against the
# vendored manifest corpus in .github/scripts/tests/fixtures/host/) and use
# a two-code exit taxonomy the escalate job greps for:
#
#     1  ESCALATE    a human decision is required (codec series moved, the
#                    host dropped our api_version, two codecs in the graph)
#     2  UNPARSEABLE the upstream shape is not understood — a bug in this
#                    repository; vendor the manifests and fix the parser
#
# The codec crate is discovered as "the git dependency of ocs_plugin_api";
# upstream renamed it acadrust -> opencadcodec at v2026.39 and respells its
# manifest regularly, so nothing may hardcode a crate or repository name.
#
# Entry points:
#   schedule          — nightly, against the latest upstream release.
#   workflow_dispatch — manual re-pin (upstream_tag defaults to the latest
#                       release; dry_run runs every gate and ships nothing).
#
# Shipping is PR-first with a direct-push fallback: the pull request is the
# audit trail, but if the repository forbids the default token from creating
# or merging pull requests ("Allow GitHub Actions to create and approve pull
# requests", off by default — it silently blocked the v2026.39..v2026.40.1
# re-pins while every build and test was green), the re-pin is pushed
# straight to main so the release still ships.
#
# The schedule lives here rather than in a separate polling workflow: the
# detect job below is the only thing that decides whether a re-pin is due,
# which keeps "is anything watching upstream?" a one-file question.

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream OpenCADStudio release tag (default: latest release)"
        required: false
        type: string
      dry_run:
        description: "Run every gate but stop before merge/tag/release"
        type: boolean
        default: false

concurrency:
  group: repin
  cancel-in-progress: false

env:
  UPSTREAM_REPO: HakanSeven12/OpenCADStudio
  GATES: .github/scripts/repin_gates.py

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repin: ${{ steps.check.outputs.repin }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare the latest upstream release against the current pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          fi
          PIN_OUT=$(python3 "$GATES" current-pin)
          CURRENT=$(sed -n 's/^current_tag=//p' <<< "$PIN_OUT")
          FINGERPRINTS=$(sed -n 's/^fingerprints_current=//p' <<< "$PIN_OUT")
          echo "upstream $TAG ; pinned $CURRENT ; fingerprints_current=$FINGERPRINTS"

          if [ "$TAG" = "$CURRENT" ] && [ "$FINGERPRINTS" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Pin and fingerprints are current — nothing to do."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TAG" = "$CURRENT" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::notice::pin is current but the fingerprint record is missing or stale — refreshing the release fingerprints (host-build.json / rust-toolchain.toml)."
          fi
          if [ "$TAG" = "$CURRENT" ]; then
            echo "::notice::dry run against the current pin — the gates will run, nothing will ship."
          fi
          if [ "$DRY_RUN" != "true" ] \
             && git ls-remote --exit-code origin "refs/heads/repin/$TAG" >/dev/null 2>&1; then
            echo "Branch repin/$TAG already exists — a re-pin PR is pending."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "repin=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  repin:
    needs: detect
    if: needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.ship.outputs.release_tag }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Record the published host build
        run: |
          set -euo pipefail
          # The host's Plugin Manager gates API v4+ plugins on the exact
          # compiler the shipped host was built with (Rust has no stable
          # ABI) as well as the codec source. Scrape the host's release run
          # for its rustc and record it in host-build.json plus the channel
          # in rust-toolchain.toml; every later step builds with that
          # compiler so the Plugin Manager accepts the binary.
          python3 .github/scripts/record_host_build.py --tag "$TAG"
          cat host-build.json

      - name: Install the recorded host compiler
        run: |
          set -euo pipefail
          # rustup no longer auto-installs the toolchain named in
          # rust-toolchain.toml; install it explicitly so every build below
          # runs with the host's exact compiler.
          rustup toolchain install "$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: repin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the upstream manifests at the release tag
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          for spec in \
            "Cargo.toml:Cargo.toml" \
            "Cargo.lock:Cargo.lock" \
            "crates/ocs_plugin_api/Cargo.toml:ocs_plugin_api-Cargo.toml" \
            "crates/ocs_plugin_api/src/manifest.rs:manifest.rs"; do
            src="${spec%%:*}"; dst="${spec#*:}"
            gh api "repos/$UPSTREAM_REPO/contents/$src?ref=$TAG" \
              -H "Accept: application/vnd.github.raw" > "/tmp/upstream/$dst"
          done
          echo "Fetched upstream manifests at $TAG"

      - name: Read the pins we ship today
        id: old
        run: python3 "$GATES" current-pin

      - name: Plan the codec source the way the host resolves it
        id: plan
        run: |
          set -euo pipefail
          python3 "$GATES" host-plan \
            --plugin-api-manifest /tmp/upstream/ocs_plugin_api-Cargo.toml \
            --host-manifest /tmp/upstream/Cargo.toml \
            --host-lock /tmp/upstream/Cargo.lock

      - name: Gate on the codec series
        run: |
          python3 "$GATES" gate-series \
            --codec-package "${{ steps.plan.outputs.codec_package }}" \
            --host-lock /tmp/upstream/Cargo.lock \
            --tag "$TAG"

      - name: Gate on the plugin API version handshake
        run: |
          python3 "$GATES" gate-api \
            --manifest-rs /tmp/upstream/manifest.rs \
            --tag "$TAG"

      - name: Rewrite the pins and bump the patch version
        id: bump
        run: |
          set -euo pipefail
          python3 "$GATES" rewrite \
            --tag "$TAG" \
            --codec-package "${{ steps.plan.outputs.codec_package }}" \
            --codec-url "${{ steps.plan.outputs.codec_url }}" \
            --codec-rev "${{ steps.plan.outputs.codec_rev }}" \
            --patch-key "${{ steps.plan.outputs.patch_key }}" \
            --patch-url "${{ steps.plan.outputs.patch_url }}" \
            --patch-rev "${{ steps.plan.outputs.patch_rev }}"
          git diff --stat -- Cargo.toml plugin.toml

      - name: Merge the upstream lockfile into ours
        run: |
          set -euo pipefail
          python3 "$GATES" merge-lock \
            --upstream-lock /tmp/upstream/Cargo.lock \
            --host-manifest /tmp/upstream/Cargo.toml \
            --new-version "${{ steps.bump.outputs.newver }}"

      - name: Resolve the merged lockfile and build the release cdylib
        run: |
          set -euo pipefail
          # The merged lockfile may need a handful of plugin-specific entries
          # added or pruned; build without --locked so cargo can adjust it
          # once. Every later step enforces --locked against the result.
          #
          # The release workflow builds on Windows and macOS with --locked,
          # so the committed Cargo.lock must carry those targets' transitive
          # deps too. cargo check --target resolves and records them, then
          # fails on the plugin crate because the Ubuntu runner lacks the
          # foreign linkers — only the lockfile update is wanted here.
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo build --release
          cargo check --target x86_64-pc-windows-msvc || true
          cargo check --target aarch64-apple-darwin || true

      - name: Verify every dependency matches the upstream tree
        run: |
          python3 "$GATES" verify-lockstep \
            --upstream-lock /tmp/upstream/Cargo.lock

      - name: Gate on the codec source matching the host's
        run: |
          python3 "$GATES" gate-source \
            --plugin-api-manifest /tmp/upstream/ocs_plugin_api-Cargo.toml \
            --host-manifest /tmp/upstream/Cargo.toml

      - name: Gate on one codec at the host's rev
        run: |
          python3 "$GATES" gate-abi \
            --host-rev "${{ steps.plan.outputs.locked_rev }}" \
            --host-lock /tmp/upstream/Cargo.lock

      - name: Record the release fingerprints in plugin.toml
        run: |
          python3 "$GATES" inject-source \
            --codec-package "${{ steps.plan.outputs.codec_package }}" \
            --rustc-version "$(rustc --version)"

      - name: Gate on the release fingerprints matching the host
        run: |
          # The Plugin Manager refuses API v4+ plugins whose declared
          # compiler or codec source differ from the host's; fail the re-pin
          # here rather than ship an incompatible release.
          python3 "$GATES" verify-fingerprints \
            --rustc-version "$(rustc --version)"

      - name: Gate on the diff being purely mechanical
        run: |
          set -euo pipefail
          echo "changed files:"
          git diff --name-only
          UNEXPECTED=$(git diff --name-only \
            | grep -vE '^(Cargo\.toml|Cargo\.lock|plugin\.toml|host-build\.json|rust-toolchain\.toml)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::the re-pin touched files beyond the manifests: $UNEXPECTED"
            exit 1
          fi

      - name: Test the plugin against the resolved lockfile
        run: cargo test --locked

      - name: Build the upstream host at the release tag
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
          git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM_REPO" /tmp/upstream-repo
          cargo build --manifest-path /tmp/upstream-repo/Cargo.toml

      - name: Smoke test — headless host loads the re-pinned plugin
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/plugins/opencad.python_repl"
          cp plugin.toml "$STAGE/plugins/opencad.python_repl/"
          cp target/release/libocs_python_repl.so "$STAGE/plugins/opencad.python_repl/"
          {
            echo '{"op":"new"}'
            echo '{"op":"entities"}'
          } | OCS_PLUGINS_DIR="$STAGE/plugins" /tmp/upstream-repo/target/debug/OpenCADStudio --serve \
            | tee /tmp/serve.out
          python3 - <<'PY'
          import json
          replies = [json.loads(l) for l in open("/tmp/serve.out") if l.startswith("{")]
          assert replies[0].get("ready"), "host did not report ready"
          assert replies[1].get("ok"), "new command failed"
          assert replies[2].get("ok"), "entities command failed"
          print("smoke test OK: host loaded the plugin and served commands")
          PY

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::dry run: all gates passed. Nothing committed, tagged or released."
          echo "### Dry run — all gates green" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was committed, tagged or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the re-pin pull request
        if: ${{ !inputs.dry_run }}
        id: pr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "repin/$TAG"
          git add Cargo.toml Cargo.lock plugin.toml host-build.json rust-toolchain.toml
          git commit -m "release: v${{ steps.bump.outputs.newver }} — re-pin to host $TAG" \
            -m "Codec: ${{ steps.plan.outputs.codec_package }} at ${{ steps.plan.outputs.codec_url }} (rev ${{ steps.plan.outputs.codec_rev }}), as declared by ocs_plugin_api and patched by the host tree." \
            -m "All overlapping dependencies verified against the upstream Cargo.lock."
          git push origin "repin/$TAG"

          OLD="${{ steps.old.outputs.current_tag }}"
          body=$(cat <<EOF
          Re-pin to upstream \`$TAG\`; every gate passed.

          | pin | before | after |
          |---|---|---|
          | host tag | $OLD | $TAG |
          | codec crate | ${{ steps.old.outputs.current_package }} @ ${{ steps.old.outputs.current_rev }} | ${{ steps.plan.outputs.codec_package }} @ ${{ steps.plan.outputs.locked_rev }} |
          | host [patch] | (mirrored) | ${{ steps.plan.outputs.patch_key || 'none' }} |
          | host compiler | — | $(python3 -c "import json;print(json.load(open('host-build.json'))['rustc_version'])") |
          | plugin version | ${{ steps.old.outputs.current_version }} | ${{ steps.bump.outputs.newver }} |

          Verified: host-plan reconciliation against the upstream lockfile, codec
          series, api_version acceptance window, byte-for-byte source identity,
          one codec at the host's rev, full lockstep on shared dependencies,
          mechanical diff, \`cargo test --locked\`, and a headless host at $TAG
          loading this plugin.

          Merged, tagged and released automatically; this PR is the audit trail
          and the revert point.
          EOF
          )
          # The PR is the audit trail, but shipping the release is the point.
          # If the repository forbids the default token from creating pull
          # requests ("Allow GitHub Actions to create and approve pull
          # requests" under Settings - Actions - Workflow permissions, off
          # by default — exactly this blocked the v2026.39, v2026.40 and
          # v2026.40.1 re-pins with "Resource not accessible by
          # integration"), fall back to a direct push to main in the next
          # step instead of failing the release.
          if gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "repin/$TAG" \
            --title "release: v${{ steps.bump.outputs.newver }} — re-pin to host $TAG" \
            --body "$body"; then
            echo "via=pr" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not open the re-pin pull request (usually 'Resource not accessible by integration': enable 'Allow GitHub Actions to create and approve pull requests' under Settings - Actions - Workflow permissions). Shipping via a direct push to main instead."
            echo "via=direct" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the pull request and tag the release
        if: ${{ !inputs.dry_run }}
        id: ship
        run: |
          set -euo pipefail
          NEWVER="${{ steps.bump.outputs.newver }}"

          merge_to_main() {
            # Fast-forward main to the re-pin branch; rebase once if main
            # moved during the run, and fail loudly if even that conflicts.
            if git push origin "repin/$TAG:main"; then return 0; fi
            echo "::notice::main moved during the run — rebasing the re-pin branch."
            git fetch origin main
            git rebase origin/main
            git push --force-with-lease origin "repin/$TAG"
            git push origin "repin/$TAG:main"
          }

          if [ "${{ steps.pr.outputs.via }}" = "pr" ]; then
            if ! gh pr merge --repo "$GITHUB_REPOSITORY" "repin/$TAG" --merge --delete-branch; then
              echo "::warning::pull request merge failed; shipping via a direct push to main instead."
              merge_to_main
              git push origin --delete "repin/$TAG" || true
            fi
          else
            merge_to_main
            git push origin --delete "repin/$TAG" || true
          fi

          git fetch origin main
          MERGE_SHA=$(git rev-parse origin/main)
          git tag "v$NEWVER" "$MERGE_SHA"
          git push origin "v$NEWVER"
          echo "release_tag=v$NEWVER" >> "$GITHUB_OUTPUT"
          echo "tagged v$NEWVER at $MERGE_SHA"

  release:
    needs: repin
    if: needs.repin.outputs.release_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.repin.outputs.release_tag }}

  # The escalation job re-runs the read-only gates to classify *why* the
  # re-pin failed, and opens (or updates) a per-tag issue.  A failed run
  # without a durable artifact is how nine consecutive red nightlies went
  # unnoticed once; this job is the fix for that.
  escalate:
    needs: [detect, repin]
    if: ${{ always() && failure() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run the read-only gates to classify the failure
        id: why
        run: |
          set -uo pipefail
          # Name the exact failing step so the issue cannot mislead: the
          # v2026.40.1 escalation said "most likely the plugin no longer
          # compiles" while every build and test had been green — the run
          # died opening the pull request.
          FAILED_STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | unique | join(", ")' \
            2>/dev/null || true)
          echo "failed_step=$FAILED_STEP" >> "$GITHUB_OUTPUT"
          echo "failing step(s): ${FAILED_STEP:-unknown}"

          if [ -z "$TAG" ]; then
            echo "verdict=detect" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/upstream
          for spec in \
            "Cargo.toml:Cargo.toml" \
            "Cargo.lock:Cargo.lock" \
            "crates/ocs_plugin_api/Cargo.toml:ocs_plugin_api-Cargo.toml" \
            "crates/ocs_plugin_api/src/manifest.rs:manifest.rs"; do
            src="${spec%%:*}"; dst="${spec#*:}"
            gh api "repos/$UPSTREAM_REPO/contents/$src?ref=$TAG" \
              -H "Accept: application/vnd.github.raw" > "/tmp/upstream/$dst" || {
              echo "verdict=detect" >> "$GITHUB_OUTPUT"
              exit 0
            }
          done
          plan_rc=0; plan_out=""
          plan_out=$(python3 "$GATES" host-plan \
            --plugin-api-manifest /tmp/upstream/ocs_plugin_api-Cargo.toml \
            --host-manifest /tmp/upstream/Cargo.toml \
            --host-lock /tmp/upstream/Cargo.lock 2>&1) || plan_rc=$?
          series_rc=0; api_rc=0
          if [ "$plan_rc" = 0 ]; then
            # Only the later gates make sense once the plan was derived; a
            # fallback crate name here would misreport a decision as a
            # parser gap.
            codec_package=$(printf '%s\n' "$plan_out" | sed -n 's/^codec_package=//p')
            python3 "$GATES" gate-series \
              --codec-package "${codec_package:-acadrust}" \
              --host-lock /tmp/upstream/Cargo.lock \
              --tag "$TAG" || series_rc=$?
            python3 "$GATES" gate-api \
              --manifest-rs /tmp/upstream/manifest.rs \
              --tag "$TAG" || api_rc=$?
          fi
          echo "gate exit codes: plan=$plan_rc series=$series_rc api=$api_rc"
          # A parser gap wins over a decision: an unreadable manifest is
          # always a bug in this repository, whatever else also failed.
          if [ "$plan_rc" = 2 ] || [ "$series_rc" = 2 ] || [ "$api_rc" = 2 ]; then
            echo "verdict=parser" >> "$GITHUB_OUTPUT"
          elif [ "$plan_rc" = 1 ] || [ "$series_rc" = 1 ] || [ "$api_rc" = 1 ]; then
            echo "verdict=decision" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=downstream" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the escalation issue
        env:
          VERDICT: ${{ steps.why.outputs.verdict }}
          FAILED_STEP: ${{ steps.why.outputs.failed_step }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            title="repin blocked: host $TAG needs a human"
          else
            title="repin blocked: nightly run needs a human"
          fi
          case "$VERDICT" in
            parser)
              detail=$(cat <<'EOF'
          The gates could not read upstream's manifests. This is a bug in this
          repository, not a decision: upstream respelled something again.

          Fix recipe:
          1. Vendor the offending manifests under
             `.github/scripts/tests/fixtures/host/$TAG/` (Cargo.toml, Cargo.lock,
             crates/ocs_plugin_api/Cargo.toml, manifest.rs).
          2. Teach the parser in `.github/scripts/repin_gates.py` the new shape.
          3. Add the expectations to the corpus test in the same PR.
          4. `python -m pytest .github/scripts/tests` must pass.
          EOF
            ) ;;
            decision)
              detail=$(cat <<'EOF'
          A gate stopped on purpose (codec series moved, the host dropped our
          api_version, two codecs in the graph, or a dependency mismatch).
          This needs plugin code or a human decision, not a parser fix; read
          the gate output in the run log.
          EOF
            ) ;;
            downstream)
              detail=$(cat <<EOF
          The manifests parsed and the read-only gates passed; the failing
          step was "$FAILED_STEP".

          If that is a build, test or headless-host step, the plugin most
          likely no longer compiles against the new upstream contract — read
          the failing step in the run log. If it is the pull-request or merge
          step, the re-pin was green but could not ship: check "Allow GitHub
          Actions to create and approve pull requests" under Settings -
          Actions - Workflow permissions. The workflow falls back to a
          direct push to main, so shipping should not stay blocked on it.
          EOF
            ) ;;
            *)
              detail="The run failed before a tag was determined (upstream API error?). Retry the workflow; if it persists, check the detect step."
              ;;
          esac
          body=$(cat <<EOF
          The automated re-pin did not pass its gates, so nothing was merged,
          tagged or released.

          **Run:** $RUN_URL
          **Diagnosis:** $VERDICT
          **Failing step:** ${FAILED_STEP:-unknown}

          $detail
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still blocked as of $RUN_URL (diagnosis: $VERDICT, step: ${FAILED_STEP:-unknown})."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
